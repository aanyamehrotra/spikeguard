name: Replay tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  replay:
    name: Replay tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.12'
          - os: macos-15
            python: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Verify native Apple Silicon Python
        if: runner.os == 'macOS'
        run: python -c "import platform; assert platform.machine() == 'arm64', platform.machine()"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Run the checked HTTP demo
        run: python -m scripts.demo --check --output runs/ci-demo.json
      - if: runner.os != 'Windows'
        run: bash -n scripts/serve.sh
