name: spikeguard

services:
  gateway:
    build: .
    environment:
      SPIKEGUARD_UPSTREAM: http://host.docker.internal:8080
      SPIKEGUARD_CONCURRENCY: ${SPIKEGUARD_CONCURRENCY:-2}
      SPIKEGUARD_QUEUE_LIMIT: ${SPIKEGUARD_QUEUE_LIMIT:-2}
      SPIKEGUARD_QUEUE_WAIT_S: ${SPIKEGUARD_QUEUE_WAIT_S:-0.25}
      SPIKEGUARD_DEADLINE_S: ${SPIKEGUARD_DEADLINE_S:-25}
    ports:
      - "127.0.0.1:8081:8081"

  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:13.2.5
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  prometheus-data:
  grafana-data:
